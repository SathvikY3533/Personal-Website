name: Manage Projects from Issues

# Triggered by the site's password-gated "Add Project" / per-card "Edit"
# forms, which open a pre-filled GitHub Issue (no token ever touches the
# browser). This workflow reads the issue, applies the change to
# projects/projects.json, commits it, and closes the issue.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write

jobs:
  manage-project:
    if: startsWith(github.event.issue.title, '[new-project]') || startsWith(github.event.issue.title, '[edit-project]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply change from issue body
        id: apply
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.issue.title || '';
            const body = context.payload.issue.body || '';
            const isEdit = title.startsWith('[edit-project]');

            async function comment(msg) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: msg,
              });
            }

            const match = body.match(/```json\s*([\s\S]*?)```/);
            if (!match) {
              await comment('⚠️ Could not find a fenced ```json block in this issue. No changes were made.');
              core.setFailed('No JSON block found');
              return;
            }

            let payload;
            try {
              payload = JSON.parse(match[1]);
            } catch (e) {
              await comment('⚠️ The JSON in this issue is not valid: ' + e.message + '\n\nNo changes were made.');
              core.setFailed('Invalid JSON: ' + e.message);
              return;
            }

            const path = 'projects/projects.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));

            if (isEdit) {
              const originalTitle = payload.originalTitle;
              const project = payload.project;
              if (!project || !project.title) {
                await comment('⚠️ Missing "project" object or its "title" field. No changes were made.');
                core.setFailed('Malformed edit payload');
                return;
              }
              const idx = data.findIndex(p => p.title === originalTitle);
              if (idx === -1) {
                await comment(`⚠️ Could not find an existing project titled "${originalTitle}" to update. No changes were made.`);
                core.setFailed('Original project not found');
                return;
              }
              data[idx] = project;
              core.setOutput('title', project.title);
              core.setOutput('verb', 'Updated');
            } else {
              if (!payload.title) {
                await comment('⚠️ The project JSON is missing a "title" field. No changes were made.');
                core.setFailed('Missing title');
                return;
              }
              data.push(payload);
              core.setOutput('title', payload.title);
              core.setOutput('verb', 'Added');
            }

            fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/projects.json
          git commit -m "${{ steps.apply.outputs.verb }} project: ${{ steps.apply.outputs.title }}" || echo "Nothing to commit"
          git push

      - name: Close issue with confirmation
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ ${{ steps.apply.outputs.verb }} **${{ steps.apply.outputs.title }}**. It will appear on the site after GitHub Pages rebuilds (usually under a minute).`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
